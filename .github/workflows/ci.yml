name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - name: Lint (same rules as the Obsidian Community directory review)
        run: npm run lint
      - run: npm test
      - run: npm run build
