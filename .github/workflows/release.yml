# Based on https://docs.obsidian.md/Plugins/Releasing/Release+your+plugin+with+GitHub+Actions
# Two ways to release the version in manifest.json:
# - Command line: push a tag equal to it (`npm version patch && git push --follow-tags`).
# - GitHub website: Actions → "Release Obsidian plugin" → Run workflow. This creates a draft
#   release; publishing the draft creates the tag.
# Either way the release gets main.js, manifest.json and styles.css attached (what Obsidian
# downloads), plus a zip with the plugin folder for manual installs. Running again for a version
# that already has a release replaces its files.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Determine version
        id: version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Package zip for manual installs
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          id="$(node -p "require('./manifest.json').id")"
          mkdir -p "package/$id"
          cp main.js manifest.json styles.css "package/$id/"
          (cd package && zip -r "../$id-$TAG.zip" "$id")
          echo "ZIP=$id-$TAG.zip" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            ${{ env.ZIP }}

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css "$ZIP" --clobber
            # Drop zips left over from an earlier build with a different version in its name
            gh release view "$TAG" --json assets --jq '.assets[].name' | { grep '\.zip$' | grep -vxF "$ZIP" || true; } |
              while read -r old; do gh release delete-asset "$TAG" "$old" --yes; done
          else
            # --target sets the commit the tag will point to once the draft is published
            gh release create "$TAG" \
              --title="$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              main.js manifest.json styles.css "$ZIP"
          fi
